[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "trimly"
version = "0.1.0"
description = "Turn long videos into vertical 9:16 clips with burned-in captions, locally."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "Trimly contributors" }]
keywords = ["video", "clips", "shorts", "captions", "whisper", "ffmpeg"]
classifiers = [
  "Environment :: Console",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]

# Same runtime packages as requirements.txt (pytest is a dev extra below).
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1.3",
  "python-dotenv>=1.0.1",
  "faster-whisper>=1.0.0",
  "requests>=2.31.0",
  "yt-dlp[default]>=2025.01.15",
  "fonttools>=4.50.0",
  # OpenCV 5 no longer ships the Haar cascade XML files used for face detection.
  "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
trimly = "app.cli:main"

[project.urls]
Homepage = "https://github.com/USERNAME/trimly"
Issues = "https://github.com/USERNAME/trimly/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# The web assets live at the repo root in development. Copy them inside the
# package in the wheel so installed builds never depend on the current folder.
[tool.hatch.build.targets.wheel.force-include]
"templates" = "app/templates"
"static" = "app/static"
"fonts" = "app/fonts"

[tool.hatch.build.targets.sdist]
include = [
  "/app",
  "/templates",
  "/static",
  "/fonts",
  "/scripts",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/requirements.txt",
  "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
